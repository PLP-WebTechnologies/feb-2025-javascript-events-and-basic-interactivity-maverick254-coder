<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JS Event Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎉 Welcome to the JS Playground</h1>

  <!-- Event Handling Section -->
  <section>
    <h2>Event Handling 🎈</h2>
    <button id="clickBtn">Click Me!</button>
    <div id="hoverBox">Hover over me</div>
    <input type="text" id="keyInput" placeholder="Type something..." />
    <button id="secretBtn">Double-Click Me 🤫</button>
  </section>

  <!-- Interactive Elements -->
  <section>
    <h2>Interactive Elements 🎮</h2>
    <button id="colorChanger">Change My Color</button>
    <div id="imageGallery">
      <img src="https://via.placeholder.com/150" id="galleryImg" />
      <button id="nextImg">Next Image</button>
    </div>

    <div class="tabs">
      <button class="tab" data-target="tab1">Tab 1</button>
      <button class="tab" data-target="tab2">Tab 2</button>
    </div>
    <div class="tab-content" id="tab1">Content for Tab 1</div>
    <div class="tab-content" id="tab2" style="display:none;">Content for Tab 2</div>
  </section>

  <!-- Form Validation -->
  <section>
    <h2>Form Validation 📋</h2>
    <form id="myForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <span id="passwordFeedback"></span>
      <button type="submit">Submit</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
